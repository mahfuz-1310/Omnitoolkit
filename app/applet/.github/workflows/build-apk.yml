name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION"
          # Extract major version
          if [[ "$JAVA_VERSION" =~ ^1\.([0-9]+) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          else
            MAJOR_VERSION="${JAVA_VERSION%%.*}"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%[-+.]*}"
          echo "Detected Java major version: $MAJOR_VERSION"
          if [[ -z "$MAJOR_VERSION" || "$MAJOR_VERSION" -lt 17 ]]; then
            echo "Error: Java major version must be 17 or newer, found: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java version verification passed (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Existing debug.keystore found."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified at $KEYSTORE_PATH"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Verifying APK properties..."
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verification successful: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          mkdir -p temp_release_asset
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          DEST_PATH="temp_release_asset/${ASSET_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ]; then
            echo "Error: Failed to copy APK to release asset directory."
            exit 1
          fi
          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset not found at $ASSET_PATH"
            exit 1
          fi
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES="This is an automatically generated debug APK.
          - Built by GitHub Actions
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          - Intended for testing and evaluation
          - Not a Play Store production release
          - Signed only with a temporary debug keystore"

          echo "Creating release with tag $TAG..."
          gh release create "$TAG" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES" \
            "$ASSET_PATH"
          echo "GitHub Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SUCCESS="${{ steps.publish-release.outcome }}"
          RUN_NUM="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          TITLE="Debug APK Build #$RUN_NUM"
          ASSET_FILENAME="${{ steps.prepare-asset.outputs.asset_filename }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          echo "=== APK Build & Release Summary ==-I"
          echo "Build result: SUCCESS"
          echo "Actions artifact 'app-debug-apk': UPLOADED SUCCESSFULLY"

          if [ "$RELEASE_SUCCESS" == "success" ]; then
            echo "GitHub Release publishing: SUCCESS"
            echo "Release tag: $TAG"
            echo "Release title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release asset filename: $ASSET_FILENAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo "- **Artifact**: `app-debug-apk` uploaded successfully."
              echo "- **GitHub Release URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag**: `$TAG`"
              echo "- **Asset Filename**: `$ASSET_FILENAME`"
              echo "- The APK can be downloaded directly from the release Assets section."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ WARNING: GitHub Release publishing failed or was skipped."
            echo "The APK build and Actions artifact upload succeeded."
            echo "The backup Actions artifact 'app-debug-apk' remains fully available."

            {
              echo "### ⚠️ Debug APK Build Succeeded, Release Publishing Failed"
              echo "- **Artifact**: `app-debug-apk` uploaded successfully and is available as a backup."
              echo "- **Warning**: Automatic GitHub Release creation encountered an error or lacked permissions."
              echo "- You can download the debug APK directly from the GitHub Actions workflow summary artifacts."
            } >> $GITHUB_STEP_SUMMARY
          fi
