name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f2)
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but detected version is '$JAVA_VERSION'."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore failed to be created."
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH."
            echo "Discovering APKs inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty: $APK_PATH"
            exit 1
          fi
          echo "APK verified successfully at $APK_PATH"

      # Note: GitHub Actions artifact storage quota can occasionally be hit.
      # Setting continue-on-error: true ensures that an artifact storage quota failure
      # will not block the workflow or prevent GitHub Release publishing.
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p temp_release_asset
          REPO_NAME=$(echo "${{ github.repository }}" | sed 's#.*/##' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          RELEASE_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "temp_release_asset/$RELEASE_ASSET_NAME"
          
          if [ ! -f "temp_release_asset/$RELEASE_ASSET_NAME" ] || [ ! -s "temp_release_asset/$RELEASE_ASSET_NAME" ]; then
            echo "Error: Release asset could not be prepared."
            exit 1
          fi
          echo "asset_path=temp_release_asset/$RELEASE_ASSET_NAME" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset missing or empty before release creation."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES="This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - The GitHub Actions run number: ${{ github.run_number }}.
          - The GitHub Actions run attempt: ${{ github.run_attempt }}.
          - The source commit SHA: ${{ github.sha }}.
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore."

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists. Uploading and replacing asset with --clobber..."
            gh release upload "$TAG" "$ASSET_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --target "${{ github.sha }}" \
              --latest \
              --notes "$NOTES" \
              "$ASSET_PATH"
          fi

      - name: Report APK download result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Publishing succeeded!"
            gh release view "$TAG" || true
            REPO="${{ github.repository }}"
            RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            echo "### GitHub Release Successful 🚀" >> $GITHUB_STEP_SUMMARY
            echo "- **Release URL:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded from the release Assets section. The normal Actions artifact named \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or encountered an error. However, the APK build and Actions artifact upload completed successfully."
            echo "State: The APK build succeeded and the Actions artifact named \`app-debug-apk\` remains available."
            
            echo "### GitHub Release Notice ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing failed or was skipped, but **the APK build and artifact upload succeeded**." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named \`app-debug-apk\` is available for download." >> $GITHUB_STEP_SUMMARY
          fi
